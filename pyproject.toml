[project]
name = "ckg"
dynamic = ["version"]
description = "Code Knowledge Graph (CKG) — structure-aware retrieval for coding agents. Parse codebases into typed graphs, optionally store them in Oracle PGQ, and inject dependency-aware context into pi / Claude Code / Codex so agents find the right files faster."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nacho Martinez", email = "jasperan@users.noreply.github.com" }]
keywords = ["code-graph", "retrieval", "claude-code", "oracle-database", "pgq", "agent-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.26",
    "oracledb>=3.4",
]

[project.scripts]
ckg = "ckg.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ckg.__version__" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter's judgement, not enforced
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["oracledb.*"]
ignore_missing_imports = true
