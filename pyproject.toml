[project]
name = "ckg"
version = "0.1.0"
description = "Code Knowledge Graph (CKG) — structure-aware retrieval for coding agents. Parse codebases into typed graphs, store in Oracle PGQ, and inject dependency-aware context into Claude Code / coding agents for faster, more accurate feature implementation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Nacho Martinez", email = "jasperan@users.noreply.github.com" }]
keywords = ["code-graph", "retrieval", "claude-code", "oracle-database", "pgq", "agent-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "oracledb>=3.4",
    "oracleagentmemory>=26.6.0",
    "langchain-oracledb>=1.0.0",
    "langgraph-oracledb>=1.0.0",
]

[project.optional-dependencies]
oracle = [
    "oracleagentmemory>=26.4.0",
    "langchain-oracledb>=1.0.0",
    "langgraph-oracledb>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ckg = "ckg.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
