name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Smoke-test CLI
        run: |
          uv run ckg --help >/dev/null
          cd tests/fixtures/sample_project && uv run ckg build sample_pkg --pkg-root sample_pkg --output /tmp/code_graph.json
          uv run ckg query "connect to the database" --graph /tmp/code_graph.json | head -5
